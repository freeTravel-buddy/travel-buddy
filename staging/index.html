.route-buttons[hidden], .nav-route:not(.nav-selected) .route-buttons{display:none!important}.route-buttons button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}.route-buttons svg{width:20px;height:20px;flex:none}.map-preview{width:100%;height:280px;border:1px solid #dbe7e6;border-radius:12px;background:#eef5f4;display:block;margin:10px 0}@media(max-width:500px){.map-preview{height:240px}}.map-expand{display:inline-flex;align-items:center;gap:6px;min-height:44px}.map-expand svg{width:20px;height:20px}dialog.navigation.map-full{position:fixed;inset:0;margin:0;width:100%;height:100%;height:100dvh;max-width:none;max-height:none;border-radius:0;padding:0;overflow:hidden}dialog.map-full .map-shell{position:absolute;inset:0;z-index:10;background:white;display:flex;flex-direction:column;padding: max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}dialog.map-full .map-preview{flex:1;min-height:0;height:auto;margin:0}dialog.map-full #previewLabel{margin:0}dialog.map-full .map-shell .row{flex-shrink:0}.route-buttons .open-google-map{flex-basis:100%;margin-top:4px}.route-buttons [aria-pressed="true"]{outline:2px solid #123e52;outline-offset:2px}dialog.navigation.map-full{display:flex;flex-direction:column;box-sizing:border-box}dialog.navigation.map-full>.map-shell{position:relative;inset:auto;flex:1;min-height:0;width:100%;z-index:1}dialog.map-full .map-shell>.row{position:relative;z-index:3;background:white;flex-wrap:wrap}dialog.map-full #mapExpand{position:relative;z-index:4;pointer-events:auto;touch-action:manipulation}dialog.map-full .map-preview{position:relative;z-index:0;width:100%;flex:1 1 0;min-height:0}dialog.map-full>[hidden]{display:none!important}

.map-shell[hidden]{display:none!important}</style></head><body><header><div class="row"><div><div class="tiny">🌏 FREE-FIRST TRAVEL PLANNER</div><h1>Travel Buddy <span style="font-size:13px">v1.0</span></h1><p>Flexible trips. Happier journeys.</p></div><span>🧭</span></div></header><main class="wrap"><nav id="tabs"></nav><div id="content"></div><p class="foot">Trip data stays on this device. Export a backup before clearing browser data. Navigation and weather require internet.</p></main><dialog id="activityModal" class="navigation" aria-labelledby="activityTitle"></dialog><dialog id="navigationModal" class="navigation" aria-labelledby="navigationTitle"></dialog><dialog id="staysModal" class="navigation" aria-labelledby="staysTitle"></dialog><script>
const hotels=[];const STORAGE=location.pathname.includes('/staging/')?'tb_staging':'tb_local';const todayISO=new Date().toISOString().slice(0,10);const seed={trip:'',start:todayISO,end:todayISO,hotel:'',adults:1,kids:0,pace:'relaxed',dayCount:1,showDates:true,customDates:{},activities:[],stays:[],weatherLat:null,weatherLon:null,weatherPlace:''};
const clone=x=>JSON.parse(JSON.stringify(x));let state;try{state=JSON.parse(localStorage.getItem(STORAGE)||(STORAGE==='tb_local'?localStorage.getItem('tb_v1'):null))||clone(seed)}catch{state=clone(seed)};state.dayCount=Number.isInteger(state.dayCount)&&state.dayCount>0?state.dayCount:Math.max(1,Math.round((new Date(state.end+'T12:00:00')-new Date(state.start+'T12:00:00'))/86400000)+1);state.showDates=state.showDates!==false;state.customDates=state.customDates&&typeof state.customDates==='object'&&!Array.isArray(state.customDates)?state.customDates:{};let tab=state.trip?'Itinerary':'Hotel & Trip',day=0,weather=null,weatherAt='',mood='okay',editor=-1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){syncDailyReturns();localStorage.setItem(STORAGE,JSON.stringify(state))}function dateLabel(i){let d=new Date(state.start+'T12:00:00');d.setDate(d.getDate()+i);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}function dayTitle(i){return 'Day '+(i+1)+(state.showDates?' · '+dayDate(i):'')}function shiftDate(value,offset){let d=new Date(value+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10)}function dateValue(i){return state.customDates[i]||shiftDate(state.start,i)}function dayDate(i){let d=new Date(dateValue(i)+'T12:00:00');return Number.isNaN(d.getTime())?'Date not set':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}function maps(p,mode='transit',origin=state.hotel){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(p)+'&travelmode='+mode}function nav(p,mode){window.open(maps(p,mode),'_blank','noopener')}
function initStays(){if(!Array.isArray(state.stays)){state.stays=state.hotel?[{hotel:state.hotel,from:0,to:state.dayCount-1}]:[];for(const a of state.activities){if(a.hotelDestination===undefined)a.hotelDestination=/\b(check[ -]?in|drop luggage|return to hotel)\b/i.test(a.name)||[state.hotel,...hotels].some(h=>h&& (a.place===h||a.place.startsWith(h+', ')));if(a.hotelOrigin===undefined)a.hotelOrigin=!!a.origin&&[state.hotel,...hotels].some(h=>h&&(a.origin===h||a.origin.startsWith(h+', ')))}}syncStays()}
function stayFor(i){return state.stays.filter(h=>h.from<=i&&h.to>=i).sort((a,b)=>b.from-a.from)[0]?.hotel||''}
function syncStays(){state.hotel=stayFor(0)||'';for(const a of state.activities){if(a.hotelDestination)a.place=stayFor(a.day)||'';if(a.hotelOrigin&&a.day===0){a.hotelOrigin=false;a.origin=''}else if(a.hotelOrigin)a.origin=stayFor(a.day-1)||''}}
let draftStays=null;
function proposedDates(){let start=document.getElementById('start')?.value||state.start,end=document.getElementById('end')?.value||state.end;let count=Math.round((Date.parse(end)-Date.parse(start))/86400000)+1;return Number.isInteger(count)&&count>=1&&count<=365?Array.from({length:count},(_,i)=>start===state.start&&end===state.end?dateValue(i):shiftDate(start,i)):[]}
function missingHotelDates(dates,stays){return dates.filter((_,i)=>!stays.some(h=>h.hotel?.trim()&&h.from<=i&&h.to>=i))}
function stayList(){return draftStays??state.stays}
function stayDate(i){let dates=proposedDates();return dates[i]||shiftDate(document.getElementById('start')?.value||state.start,i)}
function refreshCoverage(){let el=document.getElementById('hotelCoverage');if(!el)return;let dates=proposedDates(),missing=missingHotelDates(dates,stayList());el.textContent=!dates.length?'Choose valid trip dates.':missing.length?'No hotel assigned for: '+missing.join(', ')+'. Add or extend a hotel stay before saving.':'';el.hidden=!el.textContent}
function tripDatesChanged(){document.getElementById('staySummary').outerHTML=staySummary();refreshCoverage()}
function newStayDefaults(dates,stays){const missing=new Set(missingHotelDates(dates,stays));const from=dates.findIndex(d=>missing.has(d));if(from<0)return {hotel:'',from:-1,to:-1};let to=from;while(to+1<dates.length&&missing.has(dates[to+1]))to++;return {hotel:'',from,to}}
function stayEditor(i){let h=stayList()[i]||newStayDefaults(proposedDates(),stayList());let el=document.getElementById('stayEditor');el.innerHTML=`<label for="stayName">Hotel name / address</label><input id="stayName" value="${esc(h.hotel)}"><div class="grid"><div><label for="stayFrom">From (check-in)</label><input type="date" id="stayFrom" value="${h.from<0?'':stayDate(h.from)}"></div><div><label for="stayTo">To (check-out / last day)</label><input type="date" id="stayTo" value="${h.to<0?'':stayDate(h.to)}"></div></div><div class="row" style="margin-top:14px"><button onclick="saveStay(${i})">${i<0?'Add hotel':'Save changes'}</button><button class="secondary" onclick="staysModal.close()">Cancel</button></div>${i>=0?`<button class="danger" style="margin-top:16px" onclick="removeStay(${i})">Remove hotel</button>`:''}`;}

function saveStay(i){let hotel=document.getElementById('stayName').value.trim(),from=proposedDates().indexOf(document.getElementById('stayFrom').value),to=proposedDates().indexOf(document.getElementById('stayTo').value);if(!hotel||from<0||to<from){alert('Enter a hotel and valid dates within the trip.');return}let others=stayList().filter((_,j)=>j!==i);if(others.some(h=>h.from===from||Math.max(h.from,from)<Math.min(h.to,to)||(from===to&&h.from<from&&h.to>from)||(h.from===h.to&&from<h.from&&to>h.to))){alert('Hotel stays overlap. Adjust the existing stay first. A shared checkout/check-in date is allowed.');return}draftStays=[...others,{hotel,from,to}].sort((a,b)=>a.from-b.from);refreshStayViews()}
function removeStay(i){if(confirm('Remove this hotel stay? Linked activities will need another assigned hotel.')){stayList().splice(i,1);refreshStayViews()}}
function staySummary(){return `<section id="staySummary"><div class="row"><h3>Selected hotels</h3><button type="button" id="addHotel" onclick="openStays(this,-1)">+ Add hotel</button></div>${stayList().map((h,i)=>`<button type="button" class="activity hotel-card" data-stay-index="${i}" onclick="openStays(this,${i})"><span><strong>${esc(h.hotel)}</strong><span class="hotel-dates">From: ${esc(stayDate(h.from))}<br>To: ${esc(stayDate(h.to))}</span></span><span aria-hidden="true">›</span></button>`).join('')||'<p>No hotels selected.</p>'}<p class="muted">Tap a hotel to edit or remove its stay.</p></section>`}
const staysModal=document.getElementById('staysModal');let staysTrigger=null;
function openStays(trigger,i=-1){if(i>=0&&!stayList()[i])return;staysTrigger=trigger;staysModal.innerHTML=`<div class="row"><h2 id="staysTitle">${i<0?'Add hotel':'Edit hotel'}</h2><button class="secondary" onclick="staysModal.close()">✕ Close</button></div><p>Choose check-in and check-out dates. A shared transfer date is allowed.</p><div id="stayEditor"></div>`;stayEditor(i);staysModal.showModal();document.body.classList.add('modal-open');staysModal.scrollTop=0}
function refreshStayViews(){let summary=document.getElementById('staySummary');if(summary){summary.outerHTML=staySummary();staysTrigger=document.getElementById('addHotel')}else render();refreshCoverage();if(staysModal.open)staysModal.close()}

staysModal.addEventListener('close',()=>{document.body.classList.remove('modal-open');staysTrigger?.focus({preventScroll:true});staysTrigger=null});
initStays();save();
function setTab(t){if(t!==tab){draftStays=t==='Hotel & Trip'?clone(state.stays):null;}tab=t;render()}function render(){document.getElementById('tabs').innerHTML=['Itinerary','Hotel & Trip','Backup'].map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');document.getElementById('content').innerHTML=tab==='Itinerary'?itinerary():tab==='Hotel & Trip'?settings():backup();if(tab==='Itinerary')fetchWeather();else if(tab==='Hotel & Trip')refreshCoverage()}
function itinerary(){let acts=dailyActivities(day);return `<div class="card"><h2>${esc(state.trip)}</h2><div class="muted">${esc(stayFor(day)||'No hotel assigned')} · ${state.adults} adults · ${state.kids} children</div><label for="selectedDay">Select day</label><select id="selectedDay" onchange="day=+this.value;render()">${Array.from({length:state.dayCount},(_,i)=>`<option value="${i}" ${day===i?'selected':''}>${dayTitle(i)}</option>`).join('')}</select><button class="secondary" style="margin-top:10px;width:100%" onclick="setTab('Hotel & Trip')">Manage Itinerary Days</button><div class="weather-card"><div class="row"><h3 class="weather-heading">🌦️ Day weather</h3><button id="weatherrefresh" class="secondary" onclick="fetchWeather(true)">Refresh</button></div><div id="weatherout" role="status" aria-live="polite">Checking forecast…</div></div></div><div class="card"><h2>How is everyone feeling?</h2><div class="tabs">${[['great','😊 Energetic'],['okay','🙂 Okay'],['tired','😴 Tired'],['overwhelmed','😣 Overwhelmed']].map(([v,l])=>`<button class="${mood===v?'':'secondary'}" onclick="mood='${v}';render()">${l}</button>`).join('')}</div><p class="banner">${mood==='great'?'Enjoy the plan, with regular water and meal breaks.':mood==='okay'?'Keep the main activities, but schedule a snack and rest break.':mood==='tired'?'Consider skipping optional stops and choosing a direct taxi or pre-booked vehicle that seats everyone.':'Consider returning to the hotel or resting somewhere quiet. Protect fixed bookings before changing plans.'}</p><button class="secondary" onclick="suggest()">Suggest lighter day</button><div id="suggestion"></div></div><div class="card"><div class="row"><h2>Itinerary</h2><button onclick="edit(-1,this)">+ Add activity</button></div><h3>${dayTitle(day)}</h3><p class="muted"><strong>Accommodation:</strong> ${esc(stayFor(day)||"No hotel assigned")} <button class="secondary" onclick="setTab('Hotel & Trip')">Manage stays</button></p>${acts.map(a=>activity(a)).join('')||'<p>No activities yet. Add an activity above.</p>'}</div>`}
function samePlace(a,b){const n=x=>String(x||'').trim().toLowerCase();return !!n(a)&&!!n(b)&&(n(a)===n(b)||n(a).startsWith(n(b)+',')||n(b).startsWith(n(a)+','))}
function dailyActivities(d){return state.activities.filter(a=>a.day===d).sort((a,b)=>Number(!!a.autoReturn)-Number(!!b.autoReturn)||a.time.localeCompare(b.time))}
function departure(a){return a.day===state.dayCount-1&&/airport|departure|flight home|depart for home/i.test(a.name+' '+a.place)&&!/arrival|check.in/i.test(a.name)}
function syncDailyReturns(){state.activities=state.activities.filter(a=>!a.autoReturn);for(let d=0;d<state.dayCount;d++){let hotel=stayFor(d),list=dailyActivities(d),last=list.at(-1);if(!hotel||!last||last.hotelDestination||samePlace(last.place,hotel)||departure(last))continue;state.activities.push({day:d,time:last.time,name:'Return to Hotel',place:hotel,origin:'',hotelDestination:true,autoReturn:true,fixed:true});}}
function originFor(a){let list=dailyActivities(a.day),i=list.indexOf(a);if(a.autoReturn)return i>0?list[i-1].place:stayFor(a.day);if(i===0){if(a.day===0&&a.hotelDestination)return a.origin?.trim()||'';if(a.day===0&&/airport|ferry terminal|train station/i.test(a.origin||''))return a.origin.trim();return (a.day>0?stayFor(a.day-1):'')||stayFor(a.day)||a.origin||'';}if(a.origin?.trim())return a.origin.trim();return i>0?list[i-1].place:stayFor(a.day)}
function openActivity(i){let a=state.activities[i];if(!a)return;day=a.day;tab='Itinerary';render();requestAnimationFrame(()=>{let el=document.getElementById('activity-'+i);if(el){el.classList.add('focused');el.focus({preventScroll:true});el.scrollIntoView({behavior:'smooth',block:'center'})}})}
function routeActivity(i,mode){let a=state.activities[i];if(a)window.open(maps(a.place,mode,originFor(a)),'_blank','noopener')}
function activity(a){let i=state.activities.indexOf(a);return `<div id="activity-${i}" tabindex="-1" class="activity"><div class="row"><strong>${a.autoReturn?"After last activity":esc(a.time)} · ${esc(a.name)}</strong>${a.fixed?'<span class="pill">Keep / booked</span>':''}</div><div class="muted">From: ${esc(originFor(a))}</div><div class="muted">To: ${esc(a.place||'No hotel assigned')} ${a.hotelDestination?' · Accommodation':''}</div><div class="row"><button onclick="openNavigation(${i},this)">🧭 Navigation</button>${a.autoReturn?'<span class="pill">Automatic</span>':`<button class="secondary" onclick="event.stopPropagation();edit(${i},this)">Edit</button>`}</div></div>`}


let navigationTrigger=null;
function toggleRoutePreview(i){const modal=document.getElementById('navigationModal');const card=modal.querySelector('[data-nav-activity="'+i+'"]');const shell=modal.querySelector('.map-shell');if(card?.classList.contains('nav-selected')&&!shell.hidden){card.classList.remove('nav-selected');card.querySelector('button').setAttribute('aria-pressed','false');card.querySelector('.route-buttons').hidden=true;shell.hidden=true;document.getElementById('routePreview').src='about:blank';document.getElementById('previewLabel').textContent='';card.scrollIntoView({block:'nearest'});return;}previewMap(i,true)}
function previewMap(i,scroll=true){let a=state.activities[i];if(!a)return;let frame=document.getElementById('routePreview');let modal=document.getElementById('navigationModal');let card=modal.querySelector('[data-nav-activity="'+i+'"]');let shell=frame.closest('.map-shell');shell.hidden=false;if(card){for(const c of modal.querySelectorAll('[data-nav-activity]')){c.classList.toggle('nav-selected',c===card);c.querySelector('button').setAttribute('aria-pressed',String(c===card));c.querySelector('.route-buttons').hidden=c!==card;}if(shell.nextElementSibling!==card)card.before(shell);}let group=document.querySelector('.route-buttons[data-route="'+i+'"]');let mode=group?.querySelector('[data-mode][aria-pressed="true"]')?.dataset.mode||'transit';let flag={transit:'r',walking:'w',driving:'d'}[mode];let label={transit:'Public Transport',walking:'Walk',driving:'Drive'}[mode];frame.src='https://maps.google.com/maps?saddr='+encodeURIComponent(originFor(a))+'&daddr='+encodeURIComponent(a.place)+'&dirflg='+flag+'&output=embed';document.getElementById('previewLabel').textContent=originFor(a)+' → '+a.place+' · '+label;if(scroll)shell.scrollIntoView({block:'start',behavior:'smooth'})}
function openNavigation(i,trigger){let a=state.activities[i];if(!a)return;navigationTrigger=trigger;let modal=document.getElementById('navigationModal');let list=state.activities.filter(x=>x.day===a.day).sort((x,y)=>x.time.localeCompare(y.time));modal.innerHTML=`<div class="row"><h2 id="navigationTitle">Navigation</h2><button class="secondary" onclick="closeNavigation()" aria-label="Close navigation">✕ Close</button></div><p class="muted">${esc(dayTitle(a.day))}</p><h3>Day Map &amp; Routes</h3><p class="muted">Select an activity to preview its route. Select it again to hide the map. Choose a transportation mode or open Google Map for live directions.</p>${list.map(x=>{let j=state.activities.indexOf(x);return `<div class="nav-route" data-nav-activity="${j}" onclick="if(!event.target.closest('button'))toggleRoutePreview(${j})" style="cursor:pointer"><button class="secondary" style="width:100%;text-align:left" onclick="toggleRoutePreview(${j})" aria-pressed="false">${x.autoReturn?'After last activity':esc(x.time)} · ${esc(x.name)}</button><p>From: ${esc(originFor(x))}</p><p>To: ${esc(x.place||'No hotel assigned')}</p>${navigationButtons(j)}</div>`}).join('')}<div class="map-shell" hidden><div class="row"><h3>Map preview</h3><button id="mapExpand" class="secondary map-expand" onclick="toggleMapFull()" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Full Screen Map</span></button></div><p id="previewLabel" class="muted">${esc(originFor(a))} → ${esc(a.place)}</p><iframe id="routePreview" class="map-preview" title="Google Maps route preview" referrerpolicy="no-referrer-when-downgrade" src="about:blank" ></iframe></div>`;modal.showModal();document.body.classList.add('modal-open');previewMap(i,true);}
function navigationButtons(i){return `<div class="route-buttons" data-route="${i}" hidden onclick="event.stopPropagation()"><button aria-pressed="true" data-mode="transit" onclick="selectRouteMode(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 10h14M12 3v7M8 18l-2 3m10-3 2 3"/><circle cx="9" cy="14" r=".8"/><circle cx="15" cy="14" r=".8"/></svg>Public Transport</button><button class="secondary" aria-pressed="false" data-mode="walking" onclick="selectRouteMode(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="13" cy="4" r="2"/><path d="m7 21 4-7m5 7-3-6 1-5m-8 3 4-5 4 1 4 4"/></svg>Walk</button><button class="secondary" aria-pressed="false" data-mode="driving" onclick="selectRouteMode(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 11 2-6h10l2 6M5 17v3m14-3v3"/><rect x="3" y="11" width="18" height="6" rx="2"/><path d="M7 14h1m8 0h1"/></svg>Drive</button><button class="open-google-map" onclick="openSelectedRoute(this)">Open Google Map ↗</button></div>`}
function selectRouteMode(button){let group=button.closest('.route-buttons');for(let b of group.querySelectorAll('[data-mode]')){let selected=b===button;b.setAttribute('aria-pressed',String(selected));b.classList.toggle('secondary',!selected)}previewMap(Number(group.dataset.route),true)}
function openSelectedRoute(button){let group=button.closest('.route-buttons');let selected=group.querySelector('[data-mode][aria-pressed="true"]');if(selected)routeActivity(Number(group.dataset.route),selected.dataset.mode)}

let mapScroll=0,mapAnchor=null,mapHidden=[];function toggleMapFull(){const m=document.getElementById('navigationModal'),b=document.getElementById('mapExpand'),shell=m.querySelector('.map-shell');if(!shell||!b)return;const on=!m.classList.contains('map-full');if(on){mapScroll=m.scrollTop;mapAnchor=document.createComment('map position');shell.before(mapAnchor);m.appendChild(shell);mapHidden=Array.from(m.children).filter(n=>n!==shell).map(n=>[n,n.hidden]);for(const [n] of mapHidden)n.hidden=true;m.classList.add('map-full');m.scrollTop=0;}else{m.classList.remove('map-full');if(mapAnchor){mapAnchor.replaceWith(shell);mapAnchor=null;}for(const [n,wasHidden] of mapHidden)n.hidden=wasHidden;mapHidden=[];m.scrollTop=mapScroll;}b.setAttribute('aria-pressed',String(on));b.querySelector('span').textContent=on?'Exit Full Screen':'Full Screen Map';b.focus({preventScroll:true});if(!on)m.scrollTop=mapScroll;}

function closeNavigation(){document.getElementById('navigationModal').close()}
const navigationModal=document.getElementById('navigationModal');navigationModal.addEventListener('cancel',e=>{if(navigationModal.classList.contains('map-full')){e.preventDefault();toggleMapFull()}});navigationModal.addEventListener('close',()=>{navigationModal.classList.remove('map-full');mapAnchor=null;mapHidden=[];document.body.classList.remove('modal-open');navigationTrigger?.focus({preventScroll:true});navigationTrigger=null;navigationModal.innerHTML=''});navigationModal.addEventListener('click',e=>{if(e.target===navigationModal){let r=navigationModal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeNavigation()}});

function suggest(){let acts=state.activities.filter(a=>a.day===day&&!a.autoReturn);let optional=acts.filter(a=>!a.fixed);document.getElementById('suggestion').innerHTML=`<div class="banner" style="margin-top:12px"><strong>Suggested adjustment</strong><p>${mood==='great'?'Keep the schedule and plan rest stops.':'Keep '+acts.filter(a=>a.fixed).length+' protected activity/activities. Consider postponing '+optional.length+' flexible activity/activities, starting with '+esc(optional.at(-1)?.name||'an optional stop')+'.'}</p><p class="tiny">This suggestion does not change your saved itinerary.</p></div>`}
function updateEndDate(){state.end=shiftDate(state.start,state.dayCount-1)}
function addDay(){if(state.dayCount>=365){alert('Maximum 365 days.');return}state.dayCount++;updateEndDate();day=state.dayCount-1;save();render()}
function setDateVisibility(checked){state.showDates=checked;save();render()}
function setDayDate(value){if(!value||!/^\d{4}-\d{2}-\d{2}$/.test(value)||!Number.isFinite(Date.parse(value))){render();return}state.start=shiftDate(value,-day);state.customDates={};updateEndDate();save();render()}
function removeDay(){if(state.dayCount<=1){alert('A trip must have at least one day.');return}let target=day;if(!Number.isInteger(target)||target<0||target>=state.dayCount)return;let affected=state.activities.filter(a=>a.day===target);let fixed=affected.filter(a=>a.fixed).length;let msg='Delete Day '+(target+1)+'? This will permanently delete '+affected.length+' activities'+(fixed?' including '+fixed+' protected/booked activities':'')+'. Later days will shift forward by one. This cannot be undone unless you have a backup.';if(!confirm(msg))return;state.activities=state.activities.filter(a=>a.day!==target).map(a=>({...a,day:a.day>target?a.day-1:a.day}));let dates={};Object.entries(state.customDates).forEach(([k,v])=>{let n=Number(k);if(n<target)dates[n]=v;else if(n>target)dates[n-1]=v});state.customDates=dates;state.stays=state.stays.filter(h=>!(h.from===target&&h.to===target)).map(h=>({...h,from:h.from>target?h.from-1:h.from,to:h.to>=target?h.to-1:h.to}));state.dayCount--;syncStays();updateEndDate();day=day>target?day-1:Math.min(day,state.dayCount-1);save();render()}

let activityTrigger=null,activityScroll=0;const activityModal=document.getElementById('activityModal');function closeActivity(){activityModal.close()}activityModal.addEventListener('close',()=>{document.body.classList.remove('modal-open');activityTrigger?.focus({preventScroll:true});window.scrollTo(0,activityScroll);activityTrigger=null});function edit(i,trigger){activityTrigger=trigger;activityScroll=window.scrollY;editor=i;let a=i<0?{day,time:'12:00',name:'',place:'',fixed:false}:state.activities[i];activityModal.innerHTML=`<div class="row"><h2 id="activityTitle">${i<0?'Add':'Edit'} activity</h2><button class="secondary" onclick="closeActivity()" aria-label="Close activity editor">✕ Close</button></div><label>Activity name</label><input id="aname" value="${esc(a.name)}"><label>Starting point / address (From)</label><input id="aorigin" value="${esc(i>=0?originFor(a):'')}" placeholder="Automatic: previous destination or hotel"><p class="muted">The current From address is filled in automatically. Change it to override, or clear it to use the automatic starting point.</p><label>Destination / address (To)</label><input id="aplace" value="${esc(a.place)}" ${a.hotelDestination?'readonly':''}><label><input id="ahotel" type="checkbox" style="width:auto" ${a.hotelDestination?'checked':''} onchange="refreshHotelDestination()"> Destination is my accommodation for this day</label><label><input id="ahotelorigin" type="checkbox" style="width:auto" ${a.day>0&&a.hotelOrigin?'checked':''} ${a.day===0?'disabled':''}> Starting point is the previous night’s hotel</label><div class="grid"><div><label>Day</label><select id="aday" onchange="refreshHotelDestination()">${Array.from({length:state.dayCount},(_,j)=>`<option value="${j}" ${a.day===j?'selected':''}>Day ${j+1}</option>`).join('')}</select></div><div><label>Time</label><input id="atime" type="time" value="${esc(a.time)}"></div></div><label><input id="afixed" type="checkbox" style="width:auto" ${a.fixed?'checked':''}> Protect this activity from suggestions</label><div class="row"><button onclick="saveActivity()">Save activity</button>${i>=0?'<button class="danger" onclick="deleteActivity()">Delete</button>':''}<button class="secondary" onclick="closeActivity()">Cancel</button></div>`;activityModal.showModal();document.body.classList.add('modal-open');activityModal.scrollTop=0}
function refreshHotelDestination(){let h=document.getElementById("ahotelorigin");h.disabled=+document.getElementById("aday").value===0;if(h.disabled)h.checked=false;let p=document.getElementById("aplace"),linked=document.getElementById("ahotel").checked;p.readOnly=linked;if(linked)p.value=stayFor(+document.getElementById("aday").value)}
function saveActivity(){let a={hotelDestination:document.getElementById("ahotel").checked,hotelOrigin:+document.getElementById("aday").value>0&&document.getElementById("ahotelorigin").checked,origin:document.getElementById('aorigin').value.trim(),name:document.getElementById('aname').value.trim(),place:document.getElementById('aplace').value.trim(),day:+document.getElementById('aday').value,time:document.getElementById('atime').value,fixed:document.getElementById('afixed').checked};if(!a.name||(!a.place&&!a.hotelDestination)||!a.time){alert('Enter name, destination and time.');return}if(editor>=0&&!state.activities[editor].origin?.trim()&&a.origin===originFor(state.activities[editor]).trim())a.origin='';if(editor<0)state.activities.push(a);else state.activities[editor]=a;syncStays();save();closeActivity();render()}function deleteActivity(){if(!confirm('Delete this activity?'))return;state.activities.splice(editor,1);save();closeActivity();render()}
function settings(){return `<div class="card"><h2>Trip & hotel settings</h2>${!state.trip?'<p>Welcome! Enter your trip name, dates and accommodation, then save to begin planning.</p>':''}<label>Weather location name</label><input id="weatherPlace" value="${esc(state.weatherPlace||'')}" placeholder="City or destination"><div class="grid"><div><label>Latitude</label><input id="weatherLat" type="number" step="any" min="-90" max="90" value="${esc(state.weatherLat??'')}"></div><div><label>Longitude</label><input id="weatherLon" type="number" step="any" min="-180" max="180" value="${esc(state.weatherLon??'')}"></div></div><button class="secondary" onclick="useGPS()">Use current GPS location</button><p class="muted">For a future destination, enter its coordinates instead of your current location. Weather location is optional.</p><label>Trip name</label><input id="trip" value="${esc(state.trip)}"><div class="grid"><div><label>Start date</label><input id="start" type="date" onchange="tripDatesChanged()" value="${esc(state.start)}"></div><div><label>End date</label><input id="end" type="date" onchange="tripDatesChanged()" value="${esc(state.end)}"></div></div><div class="grid"><div><label>Adults</label><input id="adults" type="number" min="1" value="${state.adults}"></div><div><label>Children</label><input id="kids" type="number" min="0" value="${state.kids}"></div></div><label><input id="showTripDates" type="checkbox" style="width:auto" ${state.showDates?'checked':''}> Show itinerary dates</label><label>Travel pace</label><select id="pace"><option value="relaxed" ${state.pace==='relaxed'?'selected':''}>Relaxed / less walking</option><option value="balanced" ${state.pace==='balanced'?'selected':''}>Balanced</option><option value="active" ${state.pace==='active'?'selected':''}>Active</option></select>${staySummary()}<p id="hotelCoverage" role="alert" style="color:#991b1b;font-weight:600;overflow-wrap:anywhere" hidden></p><button onclick="saveSettings()">Save trip settings</button></div>`}
function updateHotelReferences(oldHotel,newHotel){if(!oldHotel||oldHotel===newHotel)return;const norm=v=>String(v??'').trim().toLowerCase();const matches=v=>norm(v)===norm(oldHotel)||norm(v).startsWith(norm(oldHotel)+',');for(const a of state.activities){if(matches(a.place))a.place=newHotel;if(matches(a.origin))a.origin=newHotel;}}
function useGPS(){if(!navigator.geolocation){alert("GPS unavailable. Use HTTPS or localhost and enter coordinates manually.");return}navigator.geolocation.getCurrentPosition(p=>{if(tab!=="Hotel & Trip")return;document.getElementById("weatherLat").value=p.coords.latitude.toFixed(5);document.getElementById("weatherLon").value=p.coords.longitude.toFixed(5);document.getElementById("weatherPlace").value="Current location"},()=>alert("Location unavailable or permission denied. Enter coordinates manually."),{timeout:10000})}
function saveSettings(){let lat=document.getElementById("weatherLat").value,lon=document.getElementById("weatherLon").value;if(!document.getElementById("trip").value.trim()){alert("Enter a trip name.");return}if((lat==="")!==(lon==="")||lat!==""&&(!Number.isFinite(+lat)||!Number.isFinite(+lon)||Math.abs(+lat)>90||Math.abs(+lon)>180)){alert("Enter valid latitude and longitude, or leave both blank.");return}let newStart=document.getElementById('start').value;let newEnd=document.getElementById('end').value;let diff=Math.round((new Date(newEnd+'T12:00:00')-new Date(newStart+'T12:00:00'))/86400000)+1;if(!Number.isFinite(diff)||diff<1||diff>365){alert('Choose a trip between 1 and 365 days.');return}let missing=missingHotelDates(proposedDates(),stayList());if(missing.length){refreshCoverage();alert('No hotel assigned for these dates:\n'+missing.join('\n')+'\nAdd or extend a hotel stay before saving.');return}if(diff<state.dayCount){let lost=state.activities.filter(a=>a.day>=diff).length;if(lost&&!confirm(`Shortening the trip removes ${lost} activities from the deleted days. Continue?`))return;state.activities=state.activities.filter(a=>a.day<diff)}state.trip=document.getElementById('trip').value.trim();state.weatherLat=lat===''?null:+lat;state.weatherLon=lon===''?null:+lon;state.weatherPlace=document.getElementById('weatherPlace').value.trim();state.stays=stayList().filter(h=>h.from<diff).map(h=>({...h,to:Math.min(h.to,diff-1)}));if(newStart!==state.start||newEnd!==state.end)state.customDates={};state.start=newStart;state.dayCount=diff;state.customDates=Object.fromEntries(Object.entries(state.customDates).filter(([k])=>+k<diff));state.end=newEnd;day=Math.min(day,diff-1);state.adults=+document.getElementById('adults').value;state.kids=+document.getElementById('kids').value;state.pace=document.getElementById('pace').value;state.showDates=document.getElementById('showTripDates').checked;syncStays();save();draftStays=clone(state.stays);render();alert('Saved on this device.')}

function weatherDescription(c){return c===0?'☀️ Clear':c<=2?'🌤️ Partly cloudy':c===3?'☁️ Overcast':c<=48?'🌫️ Fog':c<=57?'🌦️ Drizzle':c<=67?'🌧️ Rain':c<=77?'❄️ Snow':c<=82?'🌧️ Showers':c<=86?'❄️ Snow showers':'⛈️ Thunderstorms'}
function previousWeatherDate(selected,today){const cutoff=new Date(Date.parse(today)-7*86400000).toISOString().slice(0,10);for(let year=Math.min(+selected.slice(0,4)-1,+today.slice(0,4));year>=+today.slice(0,4)-8;year--){const d=year+selected.slice(4);const parsed=new Date(d+'T12:00:00Z');if(Number.isFinite(+parsed)&&parsed.toISOString().slice(0,10)===d&&d<=cutoff)return d}return null}
let weatherRequest=0; const weatherByDate=new Map();
async function fetchWeather(force=false){const out=document.getElementById('weatherout');if(!out||tab!=='Itinerary')return;const selected=dateValue(day), request=++weatherRequest;const button=document.getElementById('weatherrefresh');const active=()=>request===weatherRequest&&out.isConnected&&tab==='Itinerary'&&dateValue(day)===selected;const checked=()=>new Date().toLocaleTimeString();const show=(message)=>{if(active())out.textContent=message+' · Checked '+checked()};if(button){button.disabled=true;button.textContent='Refreshing…'}out.textContent='Checking weather for '+selected+'…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{if(state.weatherLat==null||state.weatherLon==null){show('Set your destination weather coordinates in Hotel & Trip.');return}if(!navigator.onLine){show('Offline. Connect to the internet and retry.');return}const nowDate=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=k=>nowDate.find(x=>x.type===k).value;const today=part('year')+'-'+part('month')+'-'+part('day');const delta=(Date.parse(selected)-Date.parse(today))/86400000;if(!Number.isFinite(delta)){show('Invalid itinerary date.');return}if(delta<0||delta>=16){const historical=delta<0;const sourceDate=historical?selected:previousWeatherDate(selected,today);if(!sourceDate){show('No matching historical date available.');return}const params=new URLSearchParams({latitude:String(state.weatherLat),longitude:String(state.weatherLon),daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum',timezone:'auto',start_date:sourceDate,end_date:sourceDate});const key='archive:'+params.toString();let entry=weatherByDate.get(key);if(force||!entry||Date.now()-entry.at>86400000){const r=await fetch('https://archive-api.open-meteo.com/v1/archive?'+params,{signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error('Archive unavailable');entry={data:(await r.json()).daily,at:Date.now()};weatherByDate.set(key,entry)}const w=entry.data;if(!Number.isFinite(w?.temperature_2m_min?.[0])||!Number.isFinite(w?.temperature_2m_max?.[0])){show('Historical weather not available for '+sourceDate+'.');return}if(active())out.innerHTML=`<strong class="weather-kind">${historical?'Historical weather':'Previous-year weather — not a forecast'}</strong><div class="weather-condition">${w.weather_code?.[0]==null?'Conditions unavailable':esc(weatherDescription(w.weather_code[0]))}</div><div class="weather-temp">${w.temperature_2m_min[0]}–${w.temperature_2m_max[0]}°C</div><div class="weather-rain">Precipitation: ${w.precipitation_sum?.[0]??'—'} mm</div><div class="weather-source">${esc(state.weatherPlace||"Selected location")} · Selected date: ${esc(selected)} · Historical date: ${esc(sourceDate)} · Checked ${esc(checked())} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>`;return}const cacheKey=[state.weatherLat,state.weatherLon,selected].join(',');let cached=weatherByDate.get(cacheKey);if(force||!cached||Date.now()-cached.at>=1800000){const params=new URLSearchParams({latitude:String(state.weatherLat),longitude:String(state.weatherLon),daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',start_date:selected,end_date:selected});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params,{signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error('Weather service returned '+r.status);cached={data:(await r.json()).daily,at:Date.now()};weatherByDate.set(cacheKey,cached)}if(!active())return;const w=cached.data,i=w?.time?.indexOf(selected)??-1;if(i<0||w.weather_code[i]==null){show('Forecast unavailable for '+selected);return}const fmt=v=>v==null?'—':v;out.innerHTML=`<strong class="weather-condition">${esc(weatherDescription(w.weather_code[i]))}</strong><div class="weather-temp">${fmt(w.temperature_2m_min[i])}–${fmt(w.temperature_2m_max[i])}°C</div><div class="weather-rain">Chance of rain: ${fmt(w.precipitation_probability_max[i])}%</div><div class="weather-source">${esc(state.weatherPlace||"Selected location")} · ${esc(selected)} · Updated ${esc(new Date(cached.at).toLocaleTimeString())} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>`}catch(e){show(e.name==='AbortError'?'Weather request timed out. Tap Refresh to retry.':'Could not load weather. Tap Refresh to retry.')}finally{clearTimeout(timer);if(active()&&button){button.disabled=false;button.textContent='Refresh'}}}
function backup(){return `<div class="card"><h2>Backup & restore</h2><p>Export a JSON backup before switching devices or clearing Safari data.</p><div class="row"><button onclick="exportTrip()">⬇ Export trip</button><label class="btn" style="margin:0">⬆ Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importTrip(this)"></label></div><p class="muted">Import replaces the current trip on this device.</p><button class="danger" onclick="resetTrip()">Start a new trip</button></div><div class="card"><h2>Current limitations</h2><p>Navigation opens Google Maps online. Offline map downloads, embedded GPS arrows, live MTR platform/exits, cloud sync and guaranteed background notifications are not included yet.</p></div>`}
function exportTrip(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='travel-buddy-trip.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importTrip(el){try{let v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.activities)||typeof v.hotel!=='string'||typeof v.start!=='string')throw Error();if(!confirm('Replace current trip with this backup?'))return;state=v;state.dayCount=Number.isInteger(v.dayCount)&&v.dayCount>0?v.dayCount:Math.max(1,Math.round((new Date(v.end+'T12:00:00')-new Date(v.start+'T12:00:00'))/86400000)+1);state.showDates=state.showDates!==false;state.customDates=state.customDates&&typeof state.customDates==='object'&&!Array.isArray(state.customDates)?state.customDates:{};day=0;initStays();save();render()}catch{alert('Invalid trip backup file.')}}function resetTrip(){if(confirm('Reset all local changes?')){state=clone(seed);day=0;tab="Hotel & Trip";draftStays=null;initStays();save();render()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tab==="Itinerary")fetchWeather()});window.addEventListener("online",()=>{if(tab==="Itinerary")fetchWeather()});render();setInterval(()=>{if(tab==='Itinerary'&&!document.hidden&&navigator.onLine)fetchWeather()},30*60*1000);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
