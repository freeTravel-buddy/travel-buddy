function syncStays(){state.hotel=stayFor(0)||'';for(const a of state.activities){if(a.hotelDestination)a.place=stayFor(a.day)||'';if(a.hotelOrigin&&a.day===0){a.hotelOrigin=false;a.origin=''}else if(a.hotelOrigin)a.origin=stayFor(a.day-1)||''}}

async function searchHotels(){const input=document.getElementById('stayName'),q=input.value.trim(),out=document.getElementById('hotelResults'),status=document.getElementById('hotelStatus');if(q.length<3){status.textContent='Enter at least three characters.';return}hotelController?.abort();const controller=new AbortController();hotelController=controller;const seq=++hotelRequest;out.replaceChildren();status.textContent='Searching…';const timer=setTimeout(()=>controller.abort(),12000);try{const params=new URLSearchParams({q,limit:'10'});const loc=placeChoice||{lat:state.weatherLat,lon:state.weatherLon};if(Number.isFinite(loc.lat)&&Number.isFinite(loc.lon)){params.set('lat',loc.lat);params.set('lon',loc.lon)}const r=await fetch('https://photon.komoot.io/api/?'+params,{signal:controller.signal});if(!r.ok)throw Error();const data=await r.json();if(seq!==hotelRequest||!input.isConnected||!staysModal.open)return;const matches=(data.features||[]).map(f=>{const p=f.properties||{},[lon,lat]=f.geometry?.coordinates||[];const address=[p.housenumber,p.street,p.district,p.city,p.state,p.postcode,p.country].filter(Boolean).join(', ');return {hotel:[p.name,address].filter(Boolean).join(', '),address,lat,lon,locationId:p.osm_type&&p.osm_id?p.osm_type+':'+p.osm_id:null}}).filter(h=>h.hotel&&validPin(h));status.textContent=matches.length?'Select the correct hotel or address below.':'No matches. Try adding the city or street, or enter coordinates manually.';for(const h of matches){const b=document.createElement('button');b.type='button';b.className='hotel-card';b.textContent=h.hotel;b.onclick=()=>chooseHotel(h);out.append(b)}}catch(e){if(seq===hotelRequest)status.textContent='Search unavailable. Retry or enter coordinates manually.'}finally{clearTimeout(timer)}}

function proposedDates(){let start=document.getElementById('start')?.value??state.start,end=document.getElementById('end')?.value??state.end;let count=Math.round((Date.parse(end)-Date.parse(start))/86400000)+1;return Number.isInteger(count)&&count>=1&&count<=365?Array.from({length:count},(_,i)=>start===state.start&&end===state.end?dateValue(i):shiftDate(start,i)):[]}

function refreshCoverage(){let el=document.getElementById('hotelCoverage');if(!el)return;let dates=proposedDates(),missing=missingHotelDates(dates,stayList());el.textContent=!dates.length?'Choose valid trip dates.':missing.length?'No hotel assigned for: '+missing.join(', ')+'. Add or extend a hotel stay before saving.':'';el.hidden=!el.textContent}

function newStayDefaults(dates,stays){const missing=new Set(missingHotelDates(dates,stays));const from=dates.findIndex(d=>missing.has(d));if(from<0)return {hotel:'',from:-1,to:-1};let to=from;while(to+1<dates.length&&missing.has(dates[to+1]))to++;return {hotel:'',from,to}}
function stayEditor(i){let h=stayList()[i]||newStayDefaults(proposedDates(),stayList());hotelRequest++;hotelController?.abort();hotelChoice=validPin(h)?{...h}:null;let el=document.getElementById('stayEditor');el.innerHTML=`<label for="stayName">Hotel name / address</label><input id="stayName" autocomplete="off" placeholder="Hotel name, city or street address" value="${esc(h.hotel)}" oninput="invalidateHotel()" onkeydown="if(event.key==='Enter'){event.preventDefault();searchHotels()}"><button type="button" style="margin-top:8px" onclick="searchHotels()">Search location</button><p id="hotelStatus" role="status" class="muted">${validPin(h)?'Saved location selected.':'Search and select the exact accommodation.'}</p><div id="hotelResults" style="display:grid;gap:6px;max-height:240px;overflow:auto"></div><details><summary>Manual GPS coordinates</summary><div class="grid"><div><label for="hotelLat">Latitude</label><input id="hotelLat" type="number" step="any" min="-90" max="90" value="${validPin(h)?h.lat:''}" oninput="manualHotelPin()"></div><div><label for="hotelLon">Longitude</label><input id="hotelLon" type="number" step="any" min="-180" max="180" value="${validPin(h)?h.lon:''}" oninput="manualHotelPin()"></div></div></details><p><a id="hotelPreview" target="_blank" rel="noopener" ${validPin(h)?'href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.lat+','+h.lon)+'"':'hidden'}>Preview location on Google Maps ↗</a></p><p class="muted">Search by Photon · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>. Internet required for search.</p><div class="grid"><div><label for="stayFrom">From (check-in)</label><input type="date" id="stayFrom" value="${h.from<0?'':stayDate(h.from)}"></div><div><label for="stayTo">To (check-out / last day)</label><input type="date" id="stayTo" value="${h.to<0?'':stayDate(h.to)}"></div></div><div class="row" style="margin-top:14px"><button onclick="saveStay(${i})">${i<0?'Add hotel':'Save changes'}</button><button class="secondary" onclick="staysModal.close()">Cancel</button></div>${i>=0?`<button class="danger" style="margin-top:16px" onclick="removeStay(${i})">Remove hotel</button>`:''}`;}

function saveStay(i){let hotel=document.getElementById('stayName').value.trim(),from=proposedDates().indexOf(document.getElementById('stayFrom').value),to=proposedDates().indexOf(document.getElementById('stayTo').value);if(!hotel||from<0||to<from){alert('Enter a hotel and valid dates within the trip.');return}let others=stayList().filter((_,j)=>j!==i);if(others.some(h=>h.from===from||Math.max(h.from,from)<Math.min(h.to,to)||(from===to&&h.from<from&&h.to>from)||(h.from===h.to&&from<h.from&&to>h.to))){alert('Hotel stays overlap. Adjust the existing stay first. A shared checkout/check-in date is allowed.');return}const rawLat=document.getElementById('hotelLat').value,rawLon=document.getElementById('hotelLon').value;const pin={lat:Number(rawLat),lon:Number(rawLon)};if((rawLat||rawLon)&&(!rawLat.trim()||!rawLon.trim()||!validPin(pin))){alert('Enter valid latitude and longitude.');return}const located=!!rawLat.trim()&&!!rawLon.trim()&&validPin(pin);if(!located&&!confirm('Save without an exact location? Navigation may be ambiguous.'))return;draftStays=[...others,{hotel,from,to,...(located?{...pin,address:hotelChoice?.address||hotel,locationId:hotelChoice?.locationId||null}:{})}].sort((a,b)=>a.from-b.from);refreshStayViews()}

function staySummary(){return `<section id="staySummary"><div class="row"><h3>Selected hotels</h3><button type="button" id="addHotel" onclick="openStays(this,-1)">+ Add hotel</button></div>${stayList().map((h,i)=>`<button type="button" class="activity hotel-card" data-stay-index="${i}" onclick="openStays(this,${i})"><span><strong>${esc(h.hotel)}</strong><span class="muted">${validPin(h)?'✓ Exact location saved':'Location not verified'}</span><span class="hotel-dates">From: ${esc(stayDate(h.from))}<br>To: ${esc(stayDate(h.to))}</span></span><span aria-hidden="true">›</span></button>`).join('')||'<p>No hotels selected.</p>'}<p class="muted">Tap a hotel to edit or remove its stay.</p></section>`}

const guideKey=STORAGE+':guide-dismissed';
const guideSteps=[['countryGuide','Choose your destination','Search for a country or city and select a matching result.'],['tripGuide','Set your trip details','Enter a trip name, travel dates and number of travelers.'],['staySummary','Add accommodation','Tap Add hotel and save stays covering every travel date.'],['saveTripSettings','Save your trip','Tap Save trip settings to confirm your details.'],['addActivityGuide','Create your first activity','Tap Add activity, fill in the details and save.']];

function stopGuide(){guideEditing=null;guideSearching=false;guideActive=false;try{localStorage.setItem(guideKey,'1')}catch{};clearGuide()}

function pauseCountryGuide(){if(guideActive&&guideStep===0){guideSearching=true;clearGuide()}}
function showGuideStep(){if(!guideActive)return;if(guideBusy()){clearGuide();return}const wanted=guideStep===4?'Itinerary':'Hotel & Trip';if(tab!==wanted){setTab(wanted);return}clearGuide();const [id,title,desc]=guideSteps[guideStep];const target=document.getElementById(id);if(!target)return;guideTarget=target;target.classList.add('guide-focus');const shade=document.createElement('div');shade.id='guideShade';document.body.append(shade);const tip=document.createElement('aside');tip.id='guideTip';tip.setAttribute('aria-label','Interactive setup guide');tip.innerHTML=`<div class="row"><small>STEP ${guideStep+1} OF 5</small><button class="secondary" onclick="stopGuide()" aria-label="Close guide">✕</button></div><h3>${title}</h3><p>${desc}</p><div class="row"><button class="secondary" onclick="stopGuide()">Skip guide</button><button class="secondary" onclick="moveGuide(-1)" ${guideStep===0?'disabled':''}>Back</button><button onclick="moveGuide(1)">${guideStep===4?'Finish':'Next'}</button></div>`;document.body.append(tip);const r=target.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)target.scrollIntoView({block:'center'});positionGuide()}
function moveGuide(delta){if(delta>0&&guideStep===0&&!placeChoice&&!guideProgress()[0]){pauseCountryGuide();document.getElementById("weatherPlace")?.focus();return}guideSearching=false;if(delta>0&&guideStep===3&&!guideProgress()[3]){alert('Save your trip settings first.');return}if(delta>0&&guideStep===4){if(!guideProgress()[4]){alert('Add and save your first activity first.');return}stopGuide();return}guideStep=Math.max(0,Math.min(4,guideStep+delta));showGuideStep()}
function positionGuide(){const tip=document.getElementById('guideTip'),shade=document.getElementById('guideShade');if(!tip||!shade||!guideTarget?.isConnected)return;const modal=guideBusy();tip.hidden=shade.hidden=modal;if(modal)return;const r=guideTarget.getBoundingClientRect(),w=window.innerWidth,h=window.innerHeight;const left=Math.max(0,r.left-5),right=Math.min(w,r.right+5),top=Math.max(0,Math.min(h,r.top-5)),bottom=Math.max(top,Math.min(h,r.bottom+5));shade.style.clipPath=`polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,${left}px ${top}px,${left}px ${bottom}px,${right}px ${bottom}px,${right}px ${top}px,${left}px ${top}px)`;const th=tip.offsetHeight;const below=r.bottom+12;const above=r.top-th-12;if(below+th>h&&above<8){tip.hidden=true;shade.hidden=true;return}tip.style.top=Math.max(8,Math.min(h-th-8,below+th<=h?below:above>=8?above:h-th-8))+'px';tip.style.left=Math.max(8,Math.min(w-tip.offsetWidth-8,r.left))+'px';tip.classList.toggle('guide-above',below+th>h&&above>=8);tip.style.setProperty('--arrow-x',Math.max(14,Math.min(tip.offsetWidth-14,(r.left+r.right)/2-tip.getBoundingClientRect().left))+'px')}
function scheduleGuide(){cancelAnimationFrame(guideFrame);guideFrame=requestAnimationFrame(()=>{if(!guideActive)return;if(guideProgress().every(Boolean)){stopGuide();return}if(guideStep===3&&guideProgress()[3])guideStep=4;showGuideStep()})}

function resumeGuideSoon(){clearTimeout(guideResumeTimer);guideResumeTimer=setTimeout(()=>{if(!guideActive||guideBusy())return;if(guideStep===2&&tab==='Hotel & Trip'&&proposedDates().length&&!missingHotelDates(proposedDates(),stayList()).length)guideStep=3;scheduleGuide()},180)}
function pauseGuideField(e){if(!guideActive||!guideField(e.target))return;guideEditing=e.target;clearGuide()}

document.addEventListener('focusout',e=>{if(e.target===guideEditing){guideEditing=null;resumeGuideSoon()}},true);
document.addEventListener('change',e=>{if(e.target===guideEditing&&e.target.matches('select,input[type=date],input[type=time],input[type=checkbox],input[type=radio]')){guideEditing=null;resumeGuideSoon()}},true);
document.addEventListener('pointerdown',e=>{if(!guideActive||guideField(e.target)||e.target.closest('#guideTip,#placeResults,dialog'))return;if(guideEditing){guideEditing=null;resumeGuideSoon()}},true);
const guideDialogObserver=new MutationObserver(()=>{if(!guideActive)return;if(document.querySelector('dialog[open]'))clearGuide();else resumeGuideSoon()});document.querySelectorAll('dialog').forEach(d=>guideDialogObserver.observe(d,{attributes:true,attributeFilter:['open']}));
window.addEventListener('resize',positionGuide);window.addEventListener('scroll',positionGuide,{passive:true});window.visualViewport?.addEventListener('resize',positionGuide);document.addEventListener('close',()=>{guideEditing=null;resumeGuideSoon()},true);
function setTab(t){if(t!==tab){guideSearching=false;placeChoice=null;placeRequest++;clearTimeout(placeTimer);draftStays=t==='Hotel & Trip'?clone(state.stays):null;}tab=t;render()}function render(){document.getElementById('tabs').innerHTML=['Itinerary','Hotel & Trip','Settings'].map(t=>`<button class="${tab===t?'active':''}" ${tab===t?'aria-current="page"':''} onclick="setTab('${t}')">${t}</button>`).join('');document.getElementById('content').innerHTML=tab==='Itinerary'?gettingStarted()+itinerary():tab==='Hotel & Trip'?gettingStarted()+settings():appearanceSettings()+backup();if(tab==='Itinerary')fetchWeather();else if(tab==='Hotel & Trip')refreshCoverage();scheduleGuide()}

 if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;

function itinerary(){let acts=dailyActivities(day);return `<div class="card"><h2>${esc(state.trip)}</h2><div class="muted">${esc(stayFor(day)||'No hotel assigned')} · ${state.adults} adults · ${state.kids} children</div><button class="secondary" style="margin-top:10px;width:100%" onclick="setTab('Hotel & Trip')">Manage Itinerary Days</button><div class="weather-card"><div class="row"><h3 class="weather-heading">🌦️ Day weather</h3><button id="weatherrefresh" class="secondary" onclick="fetchWeather(true)">Refresh</button></div><div id="weatherout" role="status" aria-live="polite">Checking forecast…</div></div></div><div class="card mood-card"><h2>How is everyone feeling?</h2><div class="tabs">${[['great','😊 Energetic'],['okay','🙂 Okay'],['tired','😴 Tired'],['overwhelmed','😣 Overwhelmed']].map(([v,l])=>`<button class="${mood===v?'':'secondary'}" aria-pressed="${mood===v}" onclick="mood='${v}';render()">${l}</button>`).join('')}</div><p class="banner">${mood==='great'?'Enjoy the plan, with regular water and meal breaks.':mood==='okay'?'Keep the main activities, but schedule a snack and rest break.':mood==='tired'?'Consider skipping optional stops and choosing a direct taxi or pre-booked vehicle that seats everyone.':'Consider returning to the hotel or resting somewhere quiet. Protect fixed bookings before changing plans.'}</p><button class="secondary" onclick="suggest()">Suggest lighter day</button><div id="suggestion"></div></div><div class="card"><div class="row"><h2>Itinerary</h2><button id="addActivityGuide" onclick="edit(-1,this)">+ Add activity</button></div><div class="itinerary-day-nav"><div class="day-picker"><div class="day-picker-heading"><label for="itineraryDaySelect">Select day</label><span class="day-keyboard-info"><button type="button" aria-label="Keyboard navigation information" aria-describedby="dayKeyboardTooltip" aria-expanded="false" onclick="toggleDayKeyboardInfo(this)" onpointerenter="this.parentElement.removeAttribute('data-dismissed')" onpointer function samePlace(a,b){const n=x=>String(x||'').trim().toLowerCase();return !!n(a)&&!!n(b)&&(n(a)===n(b)||n(a).startsWith(n(b)+',')||n(b).startsWith(n(a)+','))}

function syncDailyReturns(){const previous=new Map(state.activities.filter(a=>a.autoReturn).map(a=>[a.day,a]));state.activities=state.activities.filter(a=>!a.autoReturn);for(let d=0;d<state.dayCount;d++){let hotel=stayFor(d),list=dailyActivities(d),last=list.at(-1);if(state.returnSkipped?.includes(d)||!hotel||!last||last.hotelDestination||samePlace(last.place,hotel)||departure(last))continue;state.activities.push({day:d,time:previous.get(d)?.customReturnTime?previous.get(d).time:last.time,customReturnTime:!!previous.get(d)?.customReturnTime,completed:previous.get(d)?.completed===true,name:'Return to Hotel',place:hotel,origin:'',hotelDestination:true,autoReturn:true,fixed:true});}}
function originFor(a){let list=dailyActivities(a.day),i=list.indexOf(a);if(a.autoReturn)return i>0?list[i-1].place:stayFor(a.day);if(i===0){if(a.day===0&&a.hotelDestination)return a.origin?.trim()||'';if(a.day===0&&/airport|ferry terminal|train station/i.test(a.origin||''))return a.origin.trim();return (a.day>0?stayFor(a.day-1):'')||stayFor(a.day)||a.origin||'';}if(a.origin?.trim())return a.origin.trim();return i>0?list[i-1].place:stayFor(a.day)}
function openActivity(i){let a=state.activities[i];if(!a)return;day=a.day;tab='Itinerary';render();requestAnimationFrame(()=>{let el=document.getElementById('activity-'+i);if(el){el.classList.add('focused');el.focus({preventScroll:true});el.scrollIntoView({behavior:'smooth',block:'center'})}})}

function completionProgress(acts){if(!acts.length)return '';const done=acts.filter(a=>a.completed===true).length;return `<div class="completion-progress"><span>${done} of ${acts.length} activities done</span><progress aria-label="Daily activity completion" value="${done}" max="${acts.length}"></progress></div>`}function toggleCompletion(i){const a=state.activities[i];if(!a)return;const y=window.scrollY;a.completed=a.completed!==true;save();render();requestAnimationFrame(()=>{window.scrollTo(0,y);document.getElementById('completion-'+(a.autoReturn?state.activities.findIndex(x=>x.autoReturn&&x.day===a.day):state.activities.indexOf(a)))?.focus({preventScroll:true})})}function activity(a){let i=state.activities.indexOf(a);return `<div id="activity-${i}" tabindex="-1" class="activity${a.completed===true?' completed':''}"><div class="row"><strong>${a.autoReturn&&!a.customReturnTime?"After last activity":esc(a.time)} · ${esc(a.name)}</strong>${a.completed===true?'<span class="completion-status">✓ Done</span>':''}${a.fixed?'<span class="pill">Keep / booked</span>':''}</div><div class="muted">From: ${esc(originFor(a))}</div><div class="muted">To: ${esc(a.place||'No hotel assigned')} ${a.hotelDestination?' · Accommodation':''}</div><div class="row"><button onclick="openNavigation(${i},this)">🧭 Navigation</button>${a.autoReturn?'<span class="pill">Automatic</span>':''}<button class="secondary" onclick="event.stopPropagation();edit(${i},this)">Edit</button><button id="completion-${i}" class="secondary completion-toggle" aria-pressed="${a.completed===true}" onclick="toggleCompletion(${i})">${a.completed===true?'Undo':'✓ Mark as Done'}</button></div></div>`}

function openNavigation(i,trigger){let a=state.activities[i];if(!a)return;navigationTrigger=trigger;let modal=document.getElementById('navigationModal');let list=state.activities.filter(x=>x.day===a.day).sort((x,y)=>x.time.localeCompare(y.time));modal.innerHTML=`<div class="row"><h2 id="navigationTitle">Navigation</h2><button class="secondary" onclick="closeNavigation()" aria-label="Close navigation">✕ Close</button></div><p class="muted">${esc(dayTitle(a.day))}</p><h3>Day Map &amp; Routes</h3><p class="muted">Select an activity to preview its route. Select it again to hide the map. Choose a transportation mode or open Google Map for live directions.</p>${list.map(x=>{let j=state.activities.indexOf(x);return `<div class="nav-route" data-nav-activity="${j}" onclick="if(!event.target.closest('button'))toggleRoutePreview(${j})" style="cursor:pointer"><button class="secondary" style="width:100%;text-align:left" onclick="toggleRoutePreview(${j})" aria-pressed="false">${x.autoReturn&&!x.customReturnTime?'After last activity':esc(x.time)} · ${esc(x.name)}</button><p>From: ${esc(originFor(x))}</p><p>To: ${esc(x.place||'No hotel assigned')}</p>${navigationButtons(j)}</div>`}).join('')}<div class="map-shell" hidden><div class="row"><h3>Map preview</h3><button id="mapExpand" class="secondary map-expand" onclick="toggleMapFull()" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Full Screen Map</span></button></div><div class="full-route-controls"><label for="fullRouteSelect">Select itinerary route</label><select id="fullRouteSelect" onchange="chooseFullRoute(this.value)">${list.map(x=>`<option value="${state.activities.indexOf(x)}">${x.autoReturn&&!x.customReturnTime?'After last activity':esc(x.time)} · ${esc(x.name)}</option>`).join('')}</select><div class="full-mode-buttons" role="group" aria-label="Transportation mode"><button data-full-mode="transit function setDayDate(value){if(!value||!/^\d{4}-\d{2}-\d{2}$/.test(value)||!Number.isFinite(Date.parse(value))){render();return}state.start=shiftDate(value,-day);state.customDates={};updateEndDate();save();render()}
function removeDay(){if(state.dayCount<=1){alert('A trip must have at least one day.');return}let target=day;if(!Number.isInteger(target)||target<0||target>=state.dayCount)return;let affected=state.activities.filter(a=>a.day===target);let fixed=affected.filter(a=>a.fixed).length;let msg='Delete Day '+(target+1)+'? This will permanently delete '+affected.length+' activities'+(fixed?' including '+fixed+' protected/booked activities':'')+'. Later days will shift forward by one. This cannot be undone unless you have a backup.';if(!confirm(msg))return;state.activities=state.activities.filter(a=>a.day!==target).map(a=>({...a,day:a.day>target?a.day-1:a.day}));let dates={};Object.entries(state.customDates).forEach(([k,v])=>{let n=Number(k);if(n<target)dates[n]=v;else if(n>target)dates[n-1]=v});state.customDates=dates;state.stays=state.stays.filter(h=>!(h.from===target&&h.to===target)).map(h=>({...h,from:h.from>target?h.from-1:h.from,to:h.to>=target?h.to-1:h.to}));state.returnSkipped=(state.returnSkipped||[]).filter(d=>d!==target).map(d=>d>target?d-1:d);state.dayCount--;syncStays();updateEndDate();day=day>target?day-1:Math.min(day,state.dayCount-1);save();render()}

.fixed?'checked':''}> Protect this activity from suggestions</label><div class="row"><button onclick="saveActivity()">Save activity</button>${i>=0?'<button class="danger" onclick="deleteActivity()">Delete</button>':''}<button class="secondary" onclick="closeActivity()">Cancel</button></div>`;if(a.autoReturn){activityModal.querySelectorAll('input,select,textarea').forEach(el=>{if(el.id!=='atime')el.disabled=true});activityModal.querySelector('h2').insertAdjacentHTML('afterend','<p class="muted">Automatic return route. Only the time can be changed.</p>');}activityModal.showModal();document.body.classList.add('modal-open');activityModal.scrollTop=0}

therByDate.set(key,entry)}const w=entry.data;if(!Number.isFinite(w?.temperature_2m_min?.[0])||!Number.isFinite(w?.temperature_2m_max?.[0])){show('Historical weather not available for '+sourceDate+'.');return}if(active())out.innerHTML=`<strong class="weather-kind">${historical?'Historical weather':'Previous-year weather — not a forecast'}</strong><div class="weather-condition">${w.weather_code?.[0]==null?'Conditions unavailable':esc(weatherDescription(w.weather_code[0]))}</div><div class="weather-temp">${w.temperature_2m_min[0]}–${w.temperature_2m_max[0]}°C</div><div class="weather-rain">Precipitation: ${w.precipitation_sum?.[0]??'—'} mm</div><div class="weather-source">${esc(state.weatherPlace||"Selected location")} · Selected date: ${esc(selected)} · Historical date: ${esc(sourceDate)} · Checked ${esc(checked())} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>`;return}const cacheKey=[state.weatherLat,state.weatherLon,selected].join(',');let cached=weatherByDate.get(cacheKey);if(force||!cached||Date.now()-cached.at>=1800000){const params=new URLSearchParams({latitude:String(state.weatherLat),longitude:String(state.weatherLon),daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',start_date:selected,end_date:selected});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params,{signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error('Weather service returned '+r.status);cached={data:(await r.json()).daily,at:Date.now()};weatherByDate.set(cacheKey,cached)}if(!active())return;const w=cached.data,i=w?.time?.indexOf(selected)??-1;if(i<0||w.weather_code[i]==null){show('Forecast unavailable for '+selected);return}const fmt=v=>v==null?'—':v;out.innerHTML=`<strong class="weather-condition">${esc(weatherDescription(w.weather_code[i]))}</strong><div class="weather-temp">${fmt(w.temperature_2m_min[i])}–${fmt(w.temperature_2m_max[i])}°C</div><div class="weather-rain">Chance of rain: ${fmt(w.precipitation_probability_max[i])}%</div><div class="weather-source">${esc(state.weatherPlace||"Selected location")} · ${esc(selected)} · Updated ${esc(new Date(cached.at).toLocaleTimeString())} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>`}catch(e){show(e.name==='AbortError'?'Weather request timed out. Tap Refresh to retry.':'Could not load weather. Tap Refresh to retry.')}finally{clearTimeout(timer);if(active()&&button){button.disabled=false;button.textContent='Refresh'}}}
const appearanceThemes=[["Classic Teal", "Original Travel Buddy", "#eef5f4", "#123e52", "#147c82", "#173849", "#526b73", "#e5f1f0", "#f0f7fb", "#e6f2ed", "#e4f3f1", "#bed1d0"], ["Pastel Adventure", "Soft and cheerful", "#fff8f1", "#d5ede5", "#287e72", "#254e48", "#536a65", "#e5f2ec", "#fff0c9", "#ffe0bc", "#e9e2fa", "#c9d9d3"], ["Tropical Escape", "Refreshing and colorful", "#f0fbfa", "#087f8c", "#087580", "#25434b", "#526c73", "#d4f3e8", "#d4f3e8", "#ffd9a8", "#e0f0fa", "#b8d9d7"], ["Sunset Journey", "Warm and cozy", "#fff5f1", "#f5c4b5", "#a94d60", "#633e48", "#785762", "#f8e3df", "#ffe8c9", "#fadab3", "#f2dded", "#e3c7c9"], ["Modern Explorer", "Clean and sophisticated", "#f1f5fc", "#233d69", "#385dad", "#263c5d", "#536680", "#dde8ff", "#e1f1ff", "#dde8ff", "#e5e8fa", "#c5d3e8"], ["Nature & Wander", "Calm and earthy", "#f6f5eb", "#d6e2cb", "#52734d", "#334b36", "#596b54", "#e3ead9", "#f3e8c7", "#ebd8bc", "#e3ead9", "#cbd5c1"], ["Default Layout — Dusty Blue", "Default light appearance", "#f0f4f8", "#dce6f0", "#496986", "#263b50", "#526779", "#e3ebf3", "#e5eef6", "#dce7f1", "#e4edf5", "#b9c9d9"]];const appearanceAccents=[["Soft Lavender", "#B5AECF", "#343143"], ["Muted Sage", "#A4B6A0", "#303D35"], ["Dusty Blue", "#9FB5CE", "#2E3A48"], ["Warm Sand", "#C8B69C", "#3C3731"], ["Dusty Rose", "#C3A2AE", "#3D323C"]];
const appearanceKey=STORAGE+'_appearance';const appearanceMedia=window.matchMedia('(prefers-color-scheme: dark)');
const defaultAppearance={mode:'light',light:6,accent:2};let appearance={...defaultAppearance};try{const saved=JSON.parse(localStorage.getItem(appearanceKey)||'null');if(saved){if(['system','light','dark'].includes(saved.mode))appearance.mode=saved.mode;if(Number.isInteger(saved.light)&&appearanceThemes[saved.light])appearance.light=saved.light;if(Number.isInteger(saved.accent)&&appearanceAccents[saved.accent])appearance.accent=saved.accent}}catch{}
function appearanceIsDark(){return appearance.mode==='dark'||(appearance.mode==='system'&&appearanceMedia.matches)}
function applyAppearance(){const dark=appearanceIsDark(),t=appearanceThemes[appearance.light],a=appearanceAccents[appearance.accent],root=document.documentElement;root.dataset.dark=String(dark);const lightHero=[1,3,5,6].includes(appearance.light);const values=dark?{bg:'#1A1D24',card:'#252932',hero:'#252932','hero-text':'#E0E1E5','hero-muted':'#A8ADB8',accent:a[1],'on-accent':'#252932','accent-ink':a[1],ink:'#E0E1E5',muted:'#A8ADB8',border:'#525864',soft:a[2],weather:'#2B323E',mood:a[2],activity:a[2],focus:a[1]}:{bg:t[2],card:'#FFFFFF',hero:t[3],'hero-text':lightHero?t[5]:'#FFFFFF','hero-muted':lightHero?t[5]:'#E5F0F4',accent:t[4],'on-accent':'#FFFFFF','accent-ink':t[4],ink:t[5],muted:t[6],soft:t[7],weather:t[8],mood:t[9],activity:t[10],border:t[11],focus:t[4]};for(const [k,v] of Object.entries(values))root.style.setProperty('--'+k,v);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',values.hero);const status=document.getElementById('appearanceStatus');if(status)status.textContent='Active theme: '+(dark?'Midnight Calm · '+a[0]:t[0]);}
function changeAppearance(key,value){if(key==='mode'&&!['system','light','dark'].includes(value)||key==='light'&&!appearanceThemes[value]||key==='accent'&&!appearanceAccents[value]||!['mode','light','accent'].includes(key))return;appearance[key]=value;try{localStorage.setItem(appearanceKey,JSON.stringify(appearance))}catch{}applyAppearance();document.querySelectorAll('[data-appearance-key]').forEach(el=>{const value=String(appearance[el.dataset.appearanceKey]);if(el.tagName==='SELECT')el.value=value;else el.setAttribute('aria-pressed',String(value===el.dataset.appearanceValue))});}
function resetAppearance(){appearance={...defaultAppearance};changeAppearance('mode',appearance.mode)}
function appearanceSettings(){return `<div class="card"><h2>Settings</h2><details class="appearance-disclosure"><summary>Appearance &amp; Themes</summary><div class="appearance-body"><p class="muted">Personalize your travel experience. Your trip data stays unchanged.</p><div class="appearance-options" role="group" aria-label="Appearance mode">${[['system','Follow Device Appearance'],['light','Always Light (Default)'],['dark','Always Dark']].map(([v,l])=>`<button data-appearance-key="mode" data-appearance-value="${v}" aria-pressed="${appearance.mode===v}" onclick="changeAppearance('mode','${v}')">${l}</button>`).join('')}</div><h3>Preferred light theme</h3><p class="muted">Used in light mode, including when your device uses light appearance.</p><div class="theme-grid">${[6,0,1,2,3,4,5].map(i=>[appearanceThemes[i],i]).map(([t,i])=>`<button class="theme-choice" data-appearance-key="light" data-appearance-value="${i}" aria-pressed="${appearance.light===i}" onclick="changeAppearance('light',${i})"><span class="theme-preview" style="background:${t[2]}"><span style="background:${t[3]}"></span><span style="background:${t[8]}"></span><span style="background:${t[9]}"></span><span style="background:${t[4]};width:45%"></span></span>${t[0]}<small>${t[1]}</small></button>`).join('')}</div><h3>Midnight Calm</h3><p class="muted">Choose a gentle accent for dark mode.</p><div class="accent-options" role="group" aria-label="Dark accent">${[2,0,1,3,4].map(i=>[appearanceAccents[i],i]).map(([a,i])=>`<button data-appearance-key="accent" data-appearance-value="${i}" aria-pressed="${appearance.accent===i}" onclick="changeAppearance('accent',${i})"><span class="accent-dot" style="background:${a[1]}"></span>${a[0]}${i===2?' (Default)':''}</button>`).join('')}</div><p id="appearanceStatus" class="settings-status" role="status">Active theme: ${appearanceIsDark()?'Midnight Calm · '+appearanceAccents[appearance.accent][0]:appearanceThemes[appearance.light][0]}</p><button class="secondary" onclick="resetAppearance()">Restore Default Appearance</button></div></details></div>`}

if(appearanceMedia.addEventListener)appearanceMedia.addEventListener('change',applyAppearance);else appearanceMedia.addListener(applyAppearance);applyAppearance();

function backup(){return `<div class="card"><details class="appearance-disclosure"><summary>Backup &amp; Restore</summary><div class="appearance-body"><p>Export a JSON backup before switching devices or clearing Safari data.</p><div class="row"><button onclick="exportTrip()">⬇ Export trip</button><label class="btn" style="margin:0">⬆ Import backup<input type="file" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;padding:0" onchange="importTrip(this)"></label></div><p class="muted">Import replaces the current trip on this device.</p><button class="danger" onclick="resetTrip()">Start a new trip</button></div></details></div><div class="card"><details class="appearance-disclosure"><summary>About Travel Buddy</summary><div class="appearance-body"><p>Navigation opens Google Maps online. Offline map downloads, embedded GPS arrows, live MTR platform/exits, cloud sync and guaranteed background notifications are not included yet.</p></div></details></div>`}
function exportTrip(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='travel-buddy-trip.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importTrip(el){try{let v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.activities)||typeof v.hotel!=='string'||typeof v.start!=='string')throw Error();if(!confirm('Replace current trip with this backup?'))return;state=v;state.dayCount=Number.isInteger(v.dayCount)&&v.dayCount>0?v.dayCount:Math.max(1,Math.round((new Date(v.end+'T12:00:00')-new Date(v.start+'T12:00:00'))/86400000)+1);state.showDates=state.showDates!==false;state.customDates=state.customDates&&typeof state.customDates==='object'&&!Array.isArray(state.customDates)?state.customDates:{};day=0;selectTodayIfAvailable();initStays();save();render()}catch{alert('Invalid trip backup file.')}}function resetTrip(){if(confirm('Reset all local changes?')){state=clone(seed);day=0;tab="Hotel & Trip";draftStays=null;initStays();save();render()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const changed=checkDayRollover();if(tab==="Itinerary"){if(changed)render();else fetchWeather()}}});window.addEventListener("pageshow",()=>{if(checkDayRollover()&&tab==="Itinerary")render()});window.addEventListener("online",()=>{if(tab==="Itinerary")fetchWeather()});selectTodayIfAvailable();render();try{if(!guideProgress().every(Boolean)&&!localStorage.getItem(guideKey))startGuide()}catch{};setInterval(()=>{if(!document.hidden&&checkDayRollover()&&tab==='Itinerary')render()},60000);setInterval(()=>{if(tab==='Itinerary'&&!document.hidden&&navigator.onLine)fetchWeather()},30*60*1000);
